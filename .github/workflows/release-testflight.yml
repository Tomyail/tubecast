name: Release to TestFlight

# 触发方式：统一"先打 tag 再发布"——tag 由本地命令在 CI 跑之前创建并 push，
# CI 自身运行过程中绝不创建任何匹配下面这两条规则的新 tag（这是安全监听
# testflight/* 的前提，避免自我重触发）。
#   - push 一个 vX.Y.Z tag（由本地 `pnpm release:version` 产出）→ 完整发布：
#     构建 + 上传 + 分发 + 补 GitHub prerelease notes（如果 tag 还没有的话）+
#     草稿 Release 转正。
#   - push 一个 testflight/<version>-<build> tag（由本地 `pnpm release:testflight-bump`
#     产出，只 buildNumber+1、不升版本号的同版本热修路径）→ 构建 + 上传 + 分发 +
#     补 GitHub prerelease notes，不做"转正 Release"这步（只属于正式版本 tag）。
#   - workflow_dispatch（手动）→ 保留作为手动补救/重跑入口，行为等同 testflight/* 路径。
#
# 私有 Gitea 根仓库的 mobile 子模块指针 bump 有意不放进这个 workflow——
# 两边仓库保持独立，不给 CI 发跨仓库写权限的 token。仍然需要同步指针时，
# 照旧手动跑 `pnpm release:publish`（本地 git 凭据，不经过任何新 token）。
on:
  push:
    tags:
      - "v*.*.*"
      - "testflight/*"
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up mise (Ruby toolchain)
        uses: jdx/mise-action@v2

      - name: Install fastlane (bundler)
        run: bundle install

      - name: Set up Expo / EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS Build (iOS)
        run: eas build --platform ios --profile production --non-interactive --wait --json > eas-build-result.json

      - name: Upload build to TestFlight (EAS Submit)
        # fastlane's upload_to_testflight (pilot) shells out to Apple's Transporter
        # tool, which has long-standing, unresolved bugs on Linux runners
        # (https://github.com/fastlane/fastlane/issues/16996). EAS Submit uploads
        # through EAS's own infrastructure instead, so it works fine here. The ASC
        # API Key it uses is stored server-side (configured once via
        # `eas credentials` -> App Store Connect -> API Key), not a GitHub secret.
        run: |
          BUILD_ID=$(jq -r '.[0].id' eas-build-result.json)
          eas submit --platform ios --id "$BUILD_ID" --non-interactive --wait

      - name: Write App Store Connect API key
        run: echo "${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}" > "$RUNNER_TEMP/asc-api-key.p8"

      - name: Generate raw TestFlight changelog
        run: node scripts/release.mjs testflight-changelog

      - name: Generate bilingual TestFlight notes
        run: node scripts/generate-testflight-notes.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: https://open.bigmodel.cn/api/anthropic
          RELEASE_NOTES_MODEL_ID: glm-5.2

      - name: Distribute build to TestFlight testers
        run: mise exec -- bundle exec fastlane testflight_distribute
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY_FILEPATH: ${{ runner.temp }}/asc-api-key.p8

      # 正式版本号（v*）不需要这步——一个 marketing 版本只需要 vX.Y.Z 一个 tag；
      # testflight/* 触发和 workflow_dispatch 手动触发时才跑，此时 tag 早已存在
      # （由本地命令在触发这次运行之前 push 的），这里只是补 GitHub prerelease notes。
      - name: Tag TestFlight build + update GitHub prerelease notes
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: node scripts/release.mjs testflight-tag

      # 只属于"正式版本 tag"发布路径。
      - name: Promote draft GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: gh release edit "${{ github.ref_name }}" -R Tomyail/tubecast --draft=false
